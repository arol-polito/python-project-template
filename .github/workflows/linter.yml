---
name: Lint

on: # yamllint disable-line rule:truthy
  # Lint PR branches through pull_request only, so each PR commit runs once
  push:
    branches: [main]
  pull_request: null
  workflow_dispatch: null

# Cancel superseded runs on the same PR; never cancel runs on main
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prettier is the formatter for this repository
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_JSON: false
          VALIDATE_PYTHON_BLACK: false
          DEFAULT_BRANCH: main
# EOF
